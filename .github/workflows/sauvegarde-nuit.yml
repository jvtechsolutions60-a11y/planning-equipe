# Sauvegarde chiffrée du planning, chaque nuit à 3 h (heure de Paris en hiver).
# Le fichier est chiffré (7z, AES-256) avant d'être stocké : le dépôt étant public, rien n'est lisible sans le mot de passe.
# Secrets à créer dans Settings > Secrets and variables > Actions :
#   SUPABASE_SECRET_KEY  clé secrète Supabase (Project Settings > API Keys > Secret keys)
#   BACKUP_PASSWORD      mot de passe de votre choix, gardé en lieu sûr (il sert à ouvrir les sauvegardes)
# Sans ces secrets, la tâche s'arrête sans erreur.
name: Sauvegarde de nuit

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

jobs:
  sauvegarde:
    runs-on: ubuntu-latest
    steps:
      - name: Exporter et chiffrer
        env:
          KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          PASS: ${{ secrets.BACKUP_PASSWORD }}
        run: |
          if [ -z "$KEY" ] || [ -z "$PASS" ]; then echo "Secrets absents : sauvegarde non configurée."; exit 0; fi
          d=$(date -u +%Y-%m-%d)
          base="https://fjnhuytztxxpbdajvhbq.supabase.co/rest/v1"
          # tâches (obligatoire), puis clients, modèles et historique s'ils existent ; lecture par pages de 1 000
          lire() {
            echo "[]" > "$1.json"; from=0
            while :; do
              curl -sf "$base/$1?select=*&order=id" -H "apikey: $KEY" -H "Authorization: Bearer $KEY" -H "Range: $from-$((from+999))" -o page.json || return 1
              python3 -c "import json;a=json.load(open('$1.json'));b=json.load(open('page.json'));json.dump(a+b,open('$1.json','w'));print(len(b))" > n.txt
              [ "$(cat n.txt)" -lt 1000 ] && break; from=$((from+1000))
            done
          }
          lire tasks
          for t in clients modeles historique; do lire "$t" || echo "[]" > "$t.json"; done
          python3 - "$d" <<'PY'
          import json, sys, datetime
          d = sys.argv[1]
          out = {"app": "planning-equipe", "version": 1, "exporte_le": datetime.datetime.utcnow().isoformat() + "Z"}
          for t, k in [("tasks", "tasks"), ("clients", "clients"), ("modeles", "modeles"), ("historique", "historique")]:
              out[k] = json.load(open(t + ".json"))
              print(k, len(out[k]))
          json.dump(out, open("planning-sauvegarde-" + d + ".json", "w"), ensure_ascii=False)
          PY
          7z a -t7z -mhe=on -p"$PASS" "planning-sauvegarde-$d.7z" "planning-sauvegarde-$d.json" > /dev/null
          rm -f tasks.json clients.json modeles.json historique.json page.json n.txt "planning-sauvegarde-$d.json"
      - name: Conserver 90 jours
        if: ${{ hashFiles('*.7z') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: planning-sauvegarde
          path: "*.7z"
          retention-days: 90
