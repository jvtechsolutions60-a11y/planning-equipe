# Supabase (offre gratuite) met le projet en pause après 7 jours sans activité.
# Cette tâche interroge la base tous les 3 jours pour la garder éveillée.
name: Garder Supabase actif

on:
  schedule:
    - cron: "17 6 */3 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Interroger la base
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://fjnhuytztxxpbdajvhbq.supabase.co/rest/v1/tasks?select=id&limit=1" \
            -H "apikey: sb_publishable_tjA2f6_rTOyf_M7ahl3CVQ_8UZx_FeY")
          echo "Réponse de Supabase : $code"
          test "$code" -lt 500
